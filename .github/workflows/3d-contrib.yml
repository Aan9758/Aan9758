name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # Every day at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Aan9758
          MAX_REPOS: 10
          SETTING_JSON: |
            {
              "backgroundColor": "#0d1117",
              "foregroundColor": "#c9d1d9",
              "contributionColorArray": ["#0d1117","#0e4429","#006d32","#26a641","#39d353"],
              "type": "normal"
            }

      - name: Push updated graph to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
